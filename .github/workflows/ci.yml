name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  functions:
    name: Cloud Functions (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm install
      - run: npm run build
      - run: npm test -- --ci

  functions-audit:
    name: Cloud Functions (npm audit gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm install --no-audit --ignore-scripts
      # Block merges on HIGH or CRITICAL vulnerabilities in production
      # dependencies. Lower-severity / dev-only findings are surfaced via
      # Dependabot alerts and triaged separately.
      - run: npm audit --omit=dev --audit-level=high

  flutter:
    name: Flutter app (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --no-pub

  firestore-rules:
    name: Firestore security rules (emulator integration tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firestore/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: firestore/tests/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install --legacy-peer-deps
      - run: npm test

  e2e:
    name: End-to-end (auth + firestore + functions emulator)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install functions deps
        working-directory: functions
        run: npm install --no-audit
      - name: Install e2e deps
        run: npm install --legacy-peer-deps --no-audit
      - run: npm test
